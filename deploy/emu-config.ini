# Arcturus settings. Written to /var/lib/bobbahotel/emu/config.ini by deploy/setup.sh (which fills
# in the database password). Everything else is in the database table emulator_settings.

db.hostname=127.0.0.1
db.port=3306
db.database=@DB_NAME@
db.username=@DB_USER@
db.password=@DB_PASSWORD@
db.params=?useSSL=false&serverTimezone=UTC
db.pool.minsize=2
db.pool.maxsize=6

# The game port and remote control only listen locally: players connect through the websocket
# plugin, behind the web server.
game.host=127.0.0.1
game.port=30000
rcon.host=127.0.0.1
rcon.port=30001
rcon.allowed=127.0.0.1

enc.enabled=false
enc.e=
enc.n=
enc.d=

runtime.threads=2
io.bossgroup.threads=1
io.workergroup.threads=2

console.mode=false
debug.mode=false
