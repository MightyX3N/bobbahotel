# Builds the hotel server (Arcturus Morningstar, GPL-3) and the websocket plugin Nitro needs
# (ms-websockets, GPL-3) from their sources, and keeps the jars as artifacts.
name: Arcturus build

on:
  push:
    branches: [build/arcturus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Arcturus Morningstar 3.5.4
        run: |
          git clone --depth 1 --branch 3-5-4 https://github.com/UnfamiliarLegacy/Arcturus.git arcturus || git clone --depth 1 https://github.com/UnfamiliarLegacy/Arcturus.git arcturus
          cd arcturus
          mvn -B -q -DskipTests install
          ls target
      - name: Nitro websockets plugin
        run: |
          git clone --depth 1 https://github.com/dank074/ms-websockets.git ms-websockets
          cd ms-websockets
          VERSION=$(cd ../arcturus && mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          sed -i "s#<version>3.0.0</version>#<version>${VERSION}</version>#" pom.xml
          mvn -B -q -DskipTests package
          ls target
      - name: Collect
        run: |
          mkdir out
          cp arcturus/target/*jar-with-dependencies.jar out/arcturus.jar
          cp ms-websockets/target/*.jar out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: arcturus
          path: out/
