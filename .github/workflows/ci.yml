# On every push and pull request: type checks and tests, and the game client is built.
# On pushes to main, if all of that passes: the release is packed and deployed to the VPS, which
# builds the furni, rooms and avatars from the licensed pictures (never in git) itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

      - name: Build the Nitro client (pinned version, with our renderer patch)
        run: |
          git clone -q https://github.com/Gurkengewuerz/nitro.git nitro-src
          cd nitro-src
          git checkout -q "$(cat ../nitro/NITRO_COMMIT)"
          git apply ../nitro/renderer.patch
          npm install --ignore-scripts --no-audit --no-fund  # its lock file is out of date, so not npm ci
          cd apps/frontend
          npx vite build --base=/client/ --outDir ../../../client
          cd ../../..
          # (the patch also points the page at its configs under /client/ and names it Bobba Hotel)
          grep -q '/client/renderer-config.json' client/index.html
          rm -f client/renderer-config.json* client/ui-config.json*

      - name: Game server (built from source by the "Arcturus build" workflow)
        run: |
          git fetch -q --depth 1 origin arcturus-bin
          mkdir -p emu/plugins
          git show FETCH_HEAD:arcturus.jar > emu/arcturus.jar
          git show FETCH_HEAD:NitroWebsockets-3.1.jar > emu/plugins/NitroWebsockets.jar
          # Our own plugin (emu-plugin/: leaving rooms through the door, ...)
          emu-plugin/build.sh emu/arcturus.jar emu/plugins/BobbaHotel.jar

      - name: Pack the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "$GITHUB_SHA" > VERSION
          npm prune --omit=dev
          tar -czf release.tar.gz VERSION LICENSE package.json package-lock.json node_modules web tools content sql nitro deploy client emu
          ls -la release.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Deploy to the VPS
        env:
          DEPLOY_HOST: hotel.playbobba.com
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS secrets are not set yet, so nothing was deployed. Run deploy/setup.sh on the VPS and add them."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "bobba@$DEPLOY_HOST" "deploy $GITHUB_SHA" < release.tar.gz
      - name: Check the live hotel
        run: |
          curl -fsS "https://hotel.playbobba.com/health"
          curl -fsS -o /dev/null -w "client %{http_code}\n" "https://hotel.playbobba.com/client/"
          curl -fsS -o /dev/null -w "furni list %{http_code}\n" "https://hotel.playbobba.com/nitro/gamedata/FurnitureData.json"
