<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobba Hotel Admin</title>
<style>
:root{--bg:#0e1a22;--panel:#1d3a4a;--edge:#5b8aa0;--fg:#fff;--muted:#a9c3d0;--accent:#ffcb3d;--bad:#ff8a8a;--ok:#7fe3a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 Verdana,sans-serif;padding:12px max(12px,env(safe-area-inset-left,0px))}
h1{margin:0 0 10px;font-size:20px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button,input,select{font:inherit;border:2px solid #000;border-radius:4px;padding:5px 9px}
button{background:var(--accent);font-weight:bold;cursor:pointer}button.sm{padding:2px 7px;font-size:12px}button.tab{background:var(--panel);color:var(--fg)}button.tab.on{background:var(--accent);color:#000}button.red{background:var(--bad)}
.card{background:var(--panel);border:2px solid #000;border-radius:6px;box-shadow:0 0 0 2px var(--edge) inset;padding:12px;margin-bottom:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #0006;vertical-align:top;word-break:break-word}th{color:var(--muted)}
.wrap{overflow-x:auto}#log{height:55vh;overflow:auto;background:#0a1218;border-radius:4px;padding:8px;font:12px/1.35 Consolas,monospace;white-space:pre-wrap}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.hidden{display:none}.muted{color:var(--muted)}
</style></head><body>
<h1>Bobba Hotel Admin</h1>
<div id="gate" class="card">Checking access…</div>
<div id="app" class="hidden">
<nav id="tabs"></nav>
<section id="t-overview"><div class="card stats" id="stats"></div>
<div class="card"><b>Announce to everyone</b><div class="row" style="margin-top:6px"><input id="ann" maxlength="200" style="flex:1;min-width:200px" placeholder="Message"><button id="annGo">Send</button></div>
<button class="red" id="restart">Restart server</button></div>
<div class="card"><b>Rooms</b><div class="wrap"><table id="rooms"></table></div></div></section>
<section id="t-players" class="hidden"><div class="card"><div class="wrap"><table id="players"></table></div></div></section>
<section id="t-chat" class="hidden"><div class="card"><div class="row"><input id="cq" placeholder="Text contains"><input id="cu" placeholder="Player name"><button id="cgo">Search</button></div><div class="wrap"><table id="chat"></table></div></div></section>
<section id="t-log" class="hidden"><div class="card"><div class="row"><label><input type="checkbox" id="follow" checked> follow</label></div><div id="log"></div></div></section>
<section id="t-users" class="hidden"><div class="card"><div class="row"><input id="uq" placeholder="Name contains"><button id="ugo">Find</button></div><div class="wrap"><table id="users"></table></div></div>
<div class="card"><b>Banned</b><div class="wrap"><table id="bans"></table></div></div></section>
</div>
<script>
const $=id=>document.getElementById(id);
const api=(p,body)=>fetch('/admin/api/'+p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}).then(r=>r.json());
// helper: build elements with textContent only (chat text is untrusted)
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{}))k==='onclick'?e.onclick=v:k==='class'?e.className=v:e.setAttribute(k,v);for(const c of kids.flat())e.append(c instanceof Node?c:String(c??''));return e}
function fill(t,head,rows){t.replaceChildren(el('tr',{},head.map(h=>el('th',{},h))),...rows.map(r=>el('tr',{},r.map(c=>el('td',{},c)))))}
const fmtT=t=>new Date(t).toLocaleString(),mb=b=>(b/1048576).toFixed(1)+' MB';
const dur=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+(h?h+'h ':'')+m+'m'};
const TABS=['overview','players','chat','log','users'];let tab='overview';
function showTab(t){tab=t;TABS.forEach(x=>{$('t-'+x).classList.toggle('hidden',x!==t)});[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='chat')searchChat();if(t==='users'){searchUsers();loadBans()}}
async function act(p,b,confirmMsg){if(confirmMsg&&!confirm(confirmMsg))return;const r=await api(p,b);if(r.error)alert(r.error);refresh()}
function playerButtons(id,name){return[el('button',{class:'sm',onclick:()=>act('kick',{id},'Kick '+name+'?')},'Kick')," ",el('button',{class:'sm',onclick:()=>{const m=prompt('Mute for how many minutes?','10');if(m)act('mute',{id,minutes:+m})}},'Mute')," ",el('button',{class:'sm red',onclick:()=>{const r=prompt('Ban '+name+'. Reason?','');if(r!==null)act('ban',{id,reason:r})}},'Ban')]}
async function refresh(){const s=await api('state');if(s.error)return;
 $('stats').replaceChildren(...[['Online',s.online.length],['Registered',s.users],['Banned',s.banned],['Uptime',dur(s.uptime)],['Server memory',mb(s.rss)],['System memory free',mb(s.freeMem)+' / '+mb(s.totalMem)],['Load (1/5/15m)',s.load.map(x=>x.toFixed(2)).join(' ')+' · '+s.cpus+' cpu'],['Database',mb(s.dbBytes)]].map(([k,v])=>el('div',{class:'stat'},el('b',{},v),el('span',{},k))));
 fill($('rooms'),['Room','Users','Max'],s.rooms.map(r=>[r.name,r.users,r.max]));
 fill($('players'),['Name','Room','Login','Muted',''],s.online.map(p=>[p.name,p.room,p.steam?'Steam '+p.steam:'guest',p.muted?'yes':'',playerButtons(p.id,p.name)]))}
async function searchChat(){const r=await api('chat?q='+encodeURIComponent($('cq').value)+'&user='+encodeURIComponent($('cu').value));fill($('chat'),['Time','Room','Player','Text'],r.map(c=>[fmtT(c.at),c.room,c.name,c.text]))}
async function searchUsers(){const r=await api('users?q='+encodeURIComponent($('uq').value));fill($('users'),['ID','Name','Steam','Created','Status',''],r.map(u=>[u.id,u.name,u.steamid||'guest',fmtT(u.created),(u.banned?'banned ':'')+(u.muted_until>Date.now()?'muted':''),[el('button',{class:'sm',onclick:()=>act('unmute',{id:u.id})},'Unmute')," ",u.banned?el('button',{class:'sm',onclick:()=>act('unban',{id:u.id}).then(loadBans)},'Unban'):el('button',{class:'sm red',onclick:()=>{const r=prompt('Ban '+u.name+'. Reason?','');if(r!==null)act('ban',{id:u.id,reason:r}).then(loadBans)}},'Ban')]]))}
async function loadBans(){const r=await api('bans');fill($('bans'),['ID','Name','Steam','Reason',''],r.map(u=>[u.id,u.name,u.steamid||'guest',u.ban_reason,el('button',{class:'sm',onclick:()=>act('unban',{id:u.id}).then(loadBans)},'Unban')]))}
let since=0;async function pollLog(){const r=await api('log?since='+since);if(r.error)return;since=r.last;const box=$('log');for(const l of r.lines){box.append(el('div',{},new Date(l.t).toLocaleTimeString()+'  '+l.line))}if(r.lines.length&&$('follow').checked)box.scrollTop=box.scrollHeight}
async function init(){const me=await fetch('/api/me').then(r=>r.json());
 if(!me.staff){$('gate').replaceChildren(me.steam?'Your Steam account is not on the staff list.':'Staff only. ',me.steam?'':el('a',{href:'/auth/steam?next=/admin',style:'color:#ffcb3d'},'Log in with Steam'));return}
 $('gate').classList.add('hidden');$('app').classList.remove('hidden');
 for(const t of TABS)$('tabs').append(el('button',{class:'tab',onclick:()=>showTab(t)},t[0].toUpperCase()+t.slice(1)));[...$('tabs').children].forEach((b,i)=>b.dataset.t=TABS[i]);
 $('tabs').append(el('a',{href:'/auth/logout?next=/admin',style:'color:#a9c3d0;align-self:center;margin-left:8px'},'Log out'));
 $('annGo').onclick=()=>{const t=$('ann').value.trim();if(t){act('announce',{text:t});$('ann').value=''}};
 $('restart').onclick=()=>act('restart',{},'Restart the server now? Everyone is disconnected.');
 $('cgo').onclick=searchChat;$('ugo').onclick=searchUsers;
 showTab('overview');refresh();pollLog();setInterval(refresh,3000);setInterval(pollLog,1500)}
init();
</script></body></html>
