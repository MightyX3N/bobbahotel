<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobba Hotel</title>
<style>
:root{--bg:#0e1a22;--panel:#1d3a4a;--edge:#5b8aa0;--fg:#fff;--muted:#a9c3d0;--accent:#ffcb3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Verdana,sans-serif;padding-block:32px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
main{max-width:860px;margin:0 auto;display:grid;gap:20px}
h1{margin:0;font-size:34px}p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:2px solid #000;border-radius:8px;box-shadow:0 0 0 2px var(--edge) inset;padding:18px;display:grid;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
a.btn{justify-self:start;background:var(--accent);color:#000;text-decoration:none;font-weight:bold;border:2px solid #000;border-radius:4px;padding:10px 20px}
.soon{opacity:.7}
</style></head><body><main>
<header><h1>Bobba Hotel</h1><p>A pixel-art hotel to hang out in. Build rooms, make friends, chat.</p></header>
<section class="card"><h2 style="margin:0">Enter the hotel</h2><p>Pick a name and walk straight in.</p><a class="btn" href="https://hotel.playbobba.com">Enter hotel</a></section>
<div class="grid">
<section class="card soon"><h3 style="margin:0">Log in / Register</h3><p>Accounts with passwords are coming soon.</p></section>
<section class="card soon"><h3 style="margin:0">Groups</h3><p>Create and join groups. Coming soon.</p></section>
<section class="card soon"><h3 style="margin:0">News</h3><p>Updates from the hotel. Coming soon.</p></section>
</div></main></body></html>
