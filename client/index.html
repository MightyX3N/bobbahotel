<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobba Hotel</title>
<style>
html,body{margin:0;height:100%;background:#0e1a22;color:#fff;font:13px Verdana,sans-serif;overflow:hidden}
#game{position:absolute;inset:0}
.panel{position:absolute;background:#1d3a4a;border:2px solid #000;border-radius:6px;box-shadow:0 0 0 2px #5b8aa0 inset;padding:10px}
#login{left:50%;top:50%;transform:translate(-50%,-50%);width:260px;text-align:center}
#login input,#chat input{width:100%;box-sizing:border-box;padding:6px;border:2px solid #000;border-radius:4px;font:inherit}
button{margin-top:8px;padding:6px 14px;background:#ffcb3d;border:2px solid #000;border-radius:4px;font:bold 13px Verdana;cursor:pointer}
#err{color:#ff8a8a;min-height:16px;margin-top:6px}
#rooms{right:10px;top:10px;width:200px;max-height:50%;overflow:auto}
#rooms div{padding:4px;cursor:pointer;border-radius:3px}#rooms div:hover{background:#2f5d75}
#chat{left:10px;right:10px;bottom:10px;padding:6px}
#title{left:10px;top:10px;padding:6px 10px}
.hidden{display:none}
</style></head><body>
<div id="game"></div>
<div id="login" class="panel"><h3 style="margin:0 0 8px">Bobba Hotel</h3>
<div id="who" style="margin-bottom:8px;color:#a9c3d0"></div><input id="name" placeholder="Choose a name" maxlength="16" autofocus><br><button id="go">Enter hotel</button><br><button id="steam" style="background:#1b2838;color:#fff">Log in with Steam</button><div id="err"></div></div>
<div id="toast" class="panel hidden" style="left:50%;top:60px;transform:translateX(-50%);max-width:80%;text-align:center"></div>
<div id="title" class="panel hidden"></div>
<div id="rooms" class="panel hidden"></div>
<div id="chat" class="panel hidden"><input id="say" placeholder="Click here to chat" maxlength="100" autocomplete="off"></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
